name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*' # Triggers workflow only on tags starting with 'v' (e.g., v1.0.0)

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        # --onefile creates a single standalone .exe
        # --windowed ensures no black command prompt appears when users run the app
        run: |
          pyinstaller --onefile --windowed --name PlotForge plotforge/main.py

      - name: Create Release and Upload Executable
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/PlotForge.exe
          generate_release_notes: true
